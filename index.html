<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teardown Atelier · 工程级 3D 拆解工坊</title>
    <meta name="description" content="基于公开规格与权威拆解的参数化 3D 拆解工坊：可旋转、可爆炸、可剖切的工程级复刻。" />
    <meta property="og:title" content="Teardown Atelier · 工程级 3D 拆解工坊" />
    <meta property="og:description" content="基于公开规格与权威拆解的参数化 3D 拆解工坊：可旋转、可爆炸、可剖切。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leo-bone.github.io/teardown-atelier/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://leo-bone.github.io/teardown-atelier/og/iphone18.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta name="twitter:image" content="https://leo-bone.github.io/teardown-atelier/og/iphone18.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 顶栏 -->
      <header id="topbar">
        <div class="brand">
          <span class="brand-mark">TA</span>
          <div class="brand-text">
            <strong>Teardown Atelier</strong>
            <span>工程级 3D 拆解工坊</span>
          </div>
        </div>
        <nav id="tabs"></nav>
        <div class="topbar-right">
          <span class="badge">参数化重建 · 非真机扫描</span>
          <div class="share-group">
            <button id="btn-share" class="mini" title="复制分享链接">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
              <span>分享</span>
            </button>
            <a id="share-x" class="mini icon" target="_blank" rel="noopener" title="分享到 X">X</a>
            <a id="share-wb" class="mini icon" target="_blank" rel="noopener" title="分享到微博">微</a>
          </div>
          <button id="btn-home" class="mini" title="返回选择页">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
            <span>选择台</span>
          </button>
          <a class="gh-link" href="https://github.com/leo-bone/teardown-atelier" target="_blank" rel="noopener" title="在 GitHub 上查看">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
            <span>GitHub</span>
          </a>
        </div>
      </header>

      <!-- 落地选择台 -->
      <div id="hero">
        <div class="hero-bg"></div>
        <div class="hero-inner">
          <div class="hero-kicker">工程级 3D 拆解 · Teardown Atelier</div>
          <h1 class="hero-title">把科技产品<span>拆开看</span></h1>
          <p class="hero-sub">基于公开规格与权威拆解的参数化重建 · 可旋转 · 可爆炸 · 可剖切</p>
          <div id="hero-cards" class="hero-cards"></div>
          <div class="hero-foot">
            选一台开始
            <button id="hero-enter" class="hero-enter">直接进入工坊 →</button>
          </div>
        </div>
      </div>

      <div id="body">
        <!-- 左栏：主体信息 + 层列表 -->
        <aside id="sidebar">
          <section class="panel intro">
            <h1 id="s-name"></h1>
            <p id="s-sub" class="muted"></p>
            <p id="s-tagline" class="tagline"></p>
            <div id="s-headline" class="headline"></div>
            <div id="repair-block" class="repair-block">
              <div class="repair-head">
                <span class="repair-score" id="repair-score">—</span>
                <div class="repair-meta">
                  <span id="repair-diff" class="repair-diff"></span>
                  <span class="repair-label">可维护性 / 拆解难度</span>
                </div>
              </div>
              <div class="repair-tools" id="repair-tools"></div>
              <p class="repair-note" id="repair-note"></p>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>结构层</h2>
              <button id="btn-show-all" class="mini">全显</button>
            </div>
            <div id="layer-list"></div>
          </section>

          <section class="panel">
            <div class="panel-head"><h2>规格</h2></div>
            <table id="spec-table"></table>
          </section>
        </aside>

        <!-- 中间：3D 视口 -->
        <main id="stage">
          <div id="viewport"></div>
          <div id="labels"></div>

          <!-- 底部工具条 -->
          <div id="toolbar">
            <div class="tool-group">
              <label>拆解程度</label>
              <input type="range" id="explode" min="0" max="100" value="0" />
              <span id="explode-val" class="mono">0%</span>
            </div>
            <div class="tool-group" id="section-tools">
              <label>剖切</label>
              <button class="mini toggle" data-sec="off">关</button>
              <button class="mini toggle" data-sec="x">X</button>
              <button class="mini toggle" data-sec="y">Y</button>
              <button class="mini toggle" data-sec="z">Z</button>
            </div>
            <div class="tool-group">
              <button id="btn-photo" class="mini toggle on">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
                <span class="btn-txt">影调</span>
              </button>
              <button id="btn-rotate" class="mini toggle on">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/></svg>
                <span class="btn-txt">自转</span>
              </button>
              <button id="btn-labels" class="mini toggle on">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
                <span class="btn-txt">标注</span>
              </button>
            </div>
            <div class="tool-group">
              <button id="btn-shot" class="mini">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 21h16"/></svg>
                导出 PNG
              </button>
              <button id="btn-reset" class="mini">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4"/></svg>
                复位
              </button>
            </div>
          </div>

          <!-- 悬浮信息卡 -->
          <div id="hotcard" hidden>
            <button id="hotcard-close" aria-label="关闭">×</button>
            <h3 id="hotcard-title"></h3>
            <div id="hotcard-body"></div>
            <div id="hotcard-stats"></div>
          </div>

          <!-- 加载遮罩 -->
          <div id="loading">
            <div class="loading-mark">TA</div>
            <div class="loading-bar"></div>
            <div>正在烘焙影棚环境…</div>
          </div>
        </main>

        <!-- 右栏：叙事 + 对比 -->
        <aside id="inspector">
          <section class="panel">
            <div class="panel-head"><h2>概述</h2></div>
            <div id="s-overview" class="prose"></div>
          </section>
          <section class="panel">
            <div class="panel-head"><h2>设计解读</h2></div>
            <div id="s-narrative" class="prose"></div>
          </section>
          <section class="panel" id="fidelity-panel">
            <div class="panel-head"><h2>建模颗粒度</h2></div>
            <div class="fid-grid">
              <div class="fid-cell">
                <span class="fid-num" id="fid-actual"></span>
                <span class="fid-cap">真实零件量</span>
              </div>
              <div class="fid-cell">
                <span class="fid-num" id="fid-modeled"></span>
                <span class="fid-cap">模型几何体</span>
              </div>
            </div>
            <p class="fid-src" id="fid-source"></p>
            <p class="fid-note" id="fid-note"></p>
          </section>
          <section class="panel" id="compare-panel">
            <div class="panel-head"><h2 id="cmp-title"></h2></div>
            <p id="cmp-note" class="muted small"></p>
            <div id="cmp-rows"></div>
          </section>
        </aside>
      </div>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
